allowBuilds:
  esbuild: true
  fsevents: false

# 親の作業場所の overrides のうち当 repo に必要な部分集合のみを配る
# （正本は親の作業場所の overrides の一覧。全量をここへ写すと親の側の検査が落ちる）
overrides:
  minimatch: "^9.0.7"
  # extract-zip（high×2・修正版なし）→ Electron 公式の置換 fork。経路限定。
  "@puppeteer/browsers>extract-zip": "npm:@electron-internal/extract-zip@^1.0.5"
  # undici: <7.30.1 の high（GHSA-4w7w-5xrc-9h26 ほか）。7 系のまま上げる
  undici: "^7.30.1"
  # eslint の系が引く minimatch: <11.0.1 の medium（GHSA-g3hv-75wg-m249）。修正版は 11 系だけ。
  # glob 10・11 は minimatch 11 と組めないので、全体ではなく eslint の系の親に限って上げる
  "eslint>minimatch": "^11.0.1"
  "@eslint/config-array>minimatch": "^11.0.1"
  "@typescript-eslint/typescript-estree>minimatch": "^11.0.1"
  # glob: >=9.0.0 <=14.0.1 の medium（GHSA-3g3m-2fjr-6pw4）。親が使う API（globSync・hasMagic）は
  # 14 にもあるので、親に限って 14 へ上げる（14 は minimatch 11 を引く）
  "workbox-build>glob": "^14.0.2"
  "js-beautify>glob": "^14.0.2"
  # 上の minimatch: "^9.0.7" が glob 14 の minimatch まで 9 系へ寄せるので、glob 14 の下は 11 系へ戻す。
  # glob 10・11 は minimatch 11 と組めないので、親の版を 14 に限る
  "glob@14>minimatch": "^11.0.1"
  # js-beautify > editorconfig と workbox-build > … > jake > filelist が引く minimatch 9 系も同じ勧告に当たる。
  # editorconfig は Minimatch#match、filelist は minimatch.match() だけを使い、どちらも 11 系にある
  "editorconfig>minimatch": "^11.0.1"
  "filelist>minimatch": "^11.0.1"
  # cheerio（pwa-asset-generator 経由）が引く encoding-sniffer 0.2.1 は whatwg-encoding 3.1.1
  # （非推奨・@exodus/bytes への置換を指示）を引く。encoding-sniffer 1.0.2 は @exodus/bytes を使い、
  # export（decodeBuffer / DecodeStream / getEncoding）と SnifferOptions の形は 0.2.1 と同一
  # （型定義の差分が注釈のみであることを確認）。cheerio が使うのも decodeBuffer / DecodeStream
  # だけであり Node も CI の 22 / 24 の範囲に収まる。cheerio は ^0.2.1 に留まるため上流待ち
  # （cheeriojs/cheerio#4977）。
  encoding-sniffer: "^1.0.2"

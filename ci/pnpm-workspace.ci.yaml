allowBuilds:
  esbuild: true
  fsevents: false

# m1-t7 D-5: outer の overrides のうち当 repo に必要な部分集合のみを配る
# （正本は scripts/m1-t3/overrides.json。全量コピーは verify:m1-t3:overrides を FAIL させる）
overrides:
  minimatch: "^9.0.7"
  # extract-zip（high×2・修正版なし）→ Electron 公式の置換 fork。経路限定（oct26-m5-t12）。
  "@puppeteer/browsers>extract-zip": "npm:@electron-internal/extract-zip@^1.0.5"
  # undici: <7.30.1 の high（GHSA-4w7w-5xrc-9h26 ほか）。7 系のまま上げる
  undici: "^7.30.1"
  # eslint の系が引く minimatch: <11.0.1 の medium（GHSA-g3hv-75wg-m249）。修正版は 11 系だけ。
  # glob 10・11 は minimatch 11 と組めないので、全体ではなく eslint の系の親に限って上げる
  "eslint>minimatch": "^11.0.1"
  "@eslint/config-array>minimatch": "^11.0.1"
  "@typescript-eslint/typescript-estree>minimatch": "^11.0.1"
  # glob: >=9.0.0 <=14.0.1 の medium（GHSA-3g3m-2fjr-6pw4）。親が使う API（globSync・hasMagic）は
  # 14 にもあるので、親に限って 14 へ上げる（14 は minimatch 11 を引く）
  "workbox-build>glob": "^14.0.2"
  "js-beautify>glob": "^14.0.2"
  # 上の minimatch: "^9.0.7" が glob 14 の minimatch まで 9 系へ寄せるので、glob 14 の下は 11 系へ戻す。
  # glob 10・11 は minimatch 11 と組めないので、親の版を 14 に限る
  "glob@14>minimatch": "^11.0.1"
